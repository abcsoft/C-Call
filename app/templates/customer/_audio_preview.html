<div class="mt-4 p-4 bg-slate-900 border border-slate-800 rounded-xl space-y-2">
    <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-teal-400 uppercase tracking-wider flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            Audio Synthesized
        </span>
        <span class="text-[10px] text-slate-500 font-mono">{{ filename }}.wav</span>
    </div>
    
    <audio controls class="w-full mt-2 focus:outline-none">
        <source src="{{ url_for('customer.serve_sound', filename=filename) }}" type="audio/wav">
        Your browser does not support the audio element.
    </audio>

    {% if elapsed %}
    <p class="text-[10px] text-slate-400 mt-1.5 leading-normal">
        Generated in <span class="font-mono font-semibold">{{ "%.1f"|format(elapsed) }}s</span> using {{ provider_desc }} ({{ voice_desc }}){% if model_desc %} — model: <span class="font-mono">{{ model_desc }}</span>{% endif %}
    </p>
    {% endif %}
</div>
