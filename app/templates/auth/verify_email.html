{% extends "base.html" %}

{% block title %}ইমেইল ভেরিফিকেশন — C-Call IVR{% endblock %}

{% block content %}
<div class="cc-auth-page">
    <header class="cc-auth-topbar">
        <div class="cc-auth-topbar-inner">
            <a href="{{ url_for('customer.index') }}" class="cc-auth-brand">
                <span class="cc-brand-badge">C</span>
                <span>C-Call IVR</span>
            </a>
        </div>
    </header>

    <main class="cc-auth-main">
        <div class="cc-auth-card text-center">
            <h1 class="text-xl font-bold text-slate-900 mb-2">ইমেইল ভেরিফিকেশন</h1>
            <p class="text-slate-600 text-sm mb-6">অনুগ্রহ করে অপেক্ষা করুন, আপনার অ্যাকাউন্ট ভেরিফাই করা হচ্ছে...</p>
            <a href="{{ url_for('auth.login') }}" class="cc-btn-primary">
                লগইন পেজে যান
            </a>
        </div>
    </main>
</div>
{% endblock %}
