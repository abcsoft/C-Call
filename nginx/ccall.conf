# Nginx production configuration — C-Call IVR SaaS
# TLS managed by Certbot (Let's Encrypt). Run once:
#   certbot --nginx -d app.ccall.com.bd --non-interactive --agree-tos -m admin@ccall.com.bd

server_tokens off;

# Rate limiting zones (defined in http{} block — add to /etc/nginx/nginx.conf)
# limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
# limit_req_zone $binary_remote_addr zone=callback:10m rate=30r/m;
# limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.ccall.com.bd;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.ccall.com.bd;

    # TLS certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/app.ccall.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.ccall.com.bd/privkey.pem;

    # TLS protocol hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "microphone=(), camera=(), geolocation=()" always;
    # CSP is set by Flask middleware (per-request nonce) — do not duplicate here.

    # ── Request limits ──────────────────────────────────────────────────────
    client_max_body_size 10m;         # audio uploads; WooCommerce payloads < 1m
    client_body_timeout 30s;
    client_header_timeout 15s;

    # ── Deny dangerous paths ────────────────────────────────────────────────
    location ~ /\.env          { deny all; return 404; }
    location ~ /\.git          { deny all; return 404; }
    location ~ /\.htaccess     { deny all; return 404; }
    location ~ \.(sql|bak|backup|dump|gz|tar)$ { deny all; return 404; }
    location /migrations/      { deny all; return 404; }
    location /instance/        { deny all; return 404; }
    location /backups/         { deny all; return 404; }
    location ~ ^/tests/        { deny all; return 404; }

    # ── Static assets ───────────────────────────────────────────────────────
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Audio/recording downloads (auth enforced by Flask) ──────────────────
    location /audio/ {
        proxy_pass http://web_upstream;
        proxy_read_timeout 30s;
        client_max_body_size 0;
    }

    # ── Payment provider callbacks (longer timeout, IP allowlist optional) ──
    location ~ ^/(payment|bkash)/ {
        proxy_pass http://web_upstream;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # limit_req zone=callback burst=20 nodelay;
    }

    # ── WooCommerce / Webhook intake ────────────────────────────────────────
    location ~ ^/api/v1/(webhook|orders) {
        proxy_pass http://web_upstream;
        proxy_read_timeout 30s;
        # limit_req zone=api burst=50 nodelay;
        client_max_body_size 2m;
    }

    # ── Auth endpoints (strict rate limit) ──────────────────────────────────
    location ~ ^/auth/(login|register|reset) {
        proxy_pass http://web_upstream;
        # limit_req zone=login burst=3 nodelay;
        proxy_read_timeout 15s;
    }

    # ── Health endpoints ─────────────────────────────────────────────────────
    location /health/ {
        proxy_pass http://web_upstream;
        proxy_read_timeout 5s;
        access_log off;
    }

    # ── Metrics (internal only — protect in production) ──────────────────────
    location /metrics {
        # allow 10.0.0.0/8;  # Prometheus scraper subnet
        # deny all;
        proxy_pass http://web_upstream;
        proxy_read_timeout 10s;
    }

    # ── General API ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://web_upstream;
        proxy_read_timeout 30s;
        # limit_req zone=api burst=100 nodelay;
    }

    # ── Default: all other routes → Flask ───────────────────────────────────
    location / {
        proxy_pass http://web_upstream;

        # Timeouts: browser requests 60s, never longer
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Upstream headers Flask needs
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (live call dashboard)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 32k;
    }

    # Connection limit
    # limit_conn conn_per_ip 20;

    error_log  /var/log/nginx/ccall_error.log warn;
    access_log /var/log/nginx/ccall_access.log combined;
}

# ── Upstream definition ──────────────────────────────────────────────────────
upstream web_upstream {
    server 127.0.0.1:5000;
    keepalive 32;
}
