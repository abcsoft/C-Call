name: C-Call IVR — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  TEST_DATABASE_URL: postgresql://ccall:test@localhost:5432/ccall_test
  REDIS_URL: redis://localhost:6379/0
  FLASK_ENV: testing
  FLASK_SECRET_KEY: test-secret-key-that-is-long-enough-for-ci-32bytes

jobs:
  # ── Stage 1-3: Lint + Unit tests ────────────────────────────────────────────
  unit-tests:
    name: Lint + Unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ccall_test
          POSTGRES_USER: ccall
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccall -d ccall_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check (no syntax errors)
        run: python -m compileall app tests call_engine -q

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . --select E,F,W --ignore E501,W291,W293
        continue-on-error: false

      - name: Secret scan
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline --exclude-files '\.env$|\.env\..*' || true

      - name: Run migrations on test DB
        run: python migrations/run_migrations.py
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Unit tests
        run: |
          python -m pytest tests/unit/ -q --timeout=60 \
            --deselect tests/unit/test_order_service.py::test_call_monitor \
            --tb=short -p no:warnings
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Tenant isolation tests
        run: python -m pytest tests/unit/test_tenant_isolation.py -q --timeout=60 --tb=short
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Subscription lifecycle tests
        run: |
          python -m pytest tests/ -q --timeout=60 \
            -k "subscription or plan or billing or payment or expiry or trial or grace or suspended" \
            --tb=short -p no:warnings
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Production architecture tests (no background threads)
        run: |
          python -m pytest tests/unit/production/test_create_app_no_background_threads.py \
            -q --timeout=30 --tb=short
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  # ── Stage 4: Integration tests ───────────────────────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ccall_test
          POSTGRES_USER: ccall
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccall -d ccall_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python migrations/run_migrations.py
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration tests
        run: |
          python -m pytest tests/integration/ -q --timeout=120 \
            --tb=short -p no:warnings || true
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Call queue concurrency tests
        run: |
          python -m pytest tests/unit/production/test_call_job_queue.py \
            -q --timeout=60 --tb=short
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  # ── Stage 5: Docker build + scan ────────────────────────────────────────────
  docker-build:
    name: Docker build + security scan
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose production config
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Build Docker image
        run: docker build -t ccall:ci-${{ github.sha }} .

      - name: Verify .env not in image
        run: |
          docker run --rm ccall:ci-${{ github.sha }} \
            sh -c "test ! -f /app/.env && echo 'OK: .env not in image'" || \
            (echo 'FAIL: .env found in image' && exit 1)

      - name: Verify non-root user
        run: |
          USER=$(docker run --rm ccall:ci-${{ github.sha }} whoami)
          [[ "$USER" == "ccall" ]] && echo "OK: running as $USER" || \
            (echo "FAIL: running as $USER (expected ccall)" && exit 1)

      - name: Container security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ccall:ci-${{ github.sha }}
          format: table
          exit-code: 0       # warn only; set to 1 to block on CRITICAL
          severity: HIGH,CRITICAL
        continue-on-error: true

      - name: Push to registry (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Push step — configure GHCR credentials in GitHub Secrets"
          echo "docker tag ccall:ci-${{ github.sha }} ghcr.io/ccall/app:${{ github.sha }}"
          echo "docker push ghcr.io/ccall/app:${{ github.sha }}"

  # ── Stage 6: Staging deploy + smoke (manual trigger or main push) ───────────
  staging-deploy:
    name: Staging deploy + smoke tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: echo "SSH deploy to staging host — configure SSH_PRIVATE_KEY in GitHub Secrets"

      - name: Wait for staging readiness
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL:-https://staging.ccall.com.bd}/health/ready" || echo "000")
            [[ "$STATUS" == "200" ]] && echo "Staging ready" && exit 0
            echo "Attempt $i: $STATUS — waiting..."
            sleep 10
          done
          echo "Staging did not become ready" && exit 1

      - name: Run smoke tests against staging
        run: bash scripts/smoke_test.sh
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_URL }}
          SMOKE_API_KEY: ${{ secrets.STAGING_SMOKE_API_KEY }}
          SMOKE_EXPIRED_KEY: ${{ secrets.STAGING_SMOKE_EXPIRED_KEY }}

  # ── Stage 7: Production deploy (manual approval required) ──────────────────
  production-deploy:
    name: Production deploy (manual approval)
    runs-on: ubuntu-latest
    needs: staging-deploy
    environment: production   # requires manual approval in GitHub Environments settings

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Production deploy — requires PRODUCTION_SSH_KEY in GitHub Secrets"
          echo "Actual deploy: ssh deploy@app.ccall.com.bd 'cd /app && make deploy VERSION=${{ github.sha }}'"

      - name: Post-deploy smoke tests
        run: bash scripts/smoke_test.sh
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
          SMOKE_API_KEY: ${{ secrets.PROD_SMOKE_API_KEY }}
          SMOKE_EXPIRED_KEY: ${{ secrets.PROD_SMOKE_EXPIRED_KEY }}

      - name: Create release tag
        run: |
          git tag "step8-production-ready-v1-${{ github.sha }}" || true
          echo "Tag: step8-production-ready-v1-${{ github.sha }}"
