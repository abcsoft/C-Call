version: '3.8'
# Isolated Coolify Staging Overlay (safe alongside existing production apps)
# Deploy as a SEPARATE Coolify Compose project (e.g., ccall-staging) with isolated
# database (ccall_staging), isolated named volumes, and Traefik staging hostname.
#
# Usage in Coolify:
#   Compose files: docker-compose.production.yml:docker-compose.staging.coolify.yml
#   Required env:  DB_PASSWORD, REDIS_PASSWORD, FLASK_SECRET_KEY,
#                  API_KEY_PEPPER, SIP_PASSWORD_ENCRYPTION_KEY, STAGING_DOMAIN,
#                  STAGING_DATABASE_URL (e.g. postgresql://ccall_staging_app:CHANGE_ME_DB_PASSWORD@postgres:5432/ccall_staging)

x-staging-env: &staging-env
  POSTGRES_DB: ccall_staging
  POSTGRES_USER: ccall_staging_app
  DATABASE_URL: ${STAGING_DATABASE_URL}
  MIGRATION_DATABASE_URL: ${STAGING_MIGRATION_DATABASE_URL:-${STAGING_DATABASE_URL}}
  REDIS_URL: ${STAGING_REDIS_URL:-${REDIS_URL}}

services:
  postgres:
    environment:
      POSTGRES_DB: ccall_staging
      POSTGRES_USER: ccall_staging_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccall_staging_app -d ccall_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    volumes:
      - staging_redis_data:/data

  migrate:
    build: .
    environment:
      <<: *staging-env
      FLASK_ENV: production
      ENABLE_SCHEDULER: "false"
      ENABLE_CALL_WORKER: "false"
      ENABLE_CALL_MONITOR: "false"

  web:
    build: .
    environment:
      <<: *staging-env
      ENABLE_SCHEDULER: "false"
      ENABLE_CALL_WORKER: "false"
      ENABLE_CALL_MONITOR: "false"
    # Override host port binding so Coolify Traefik routes by hostname without port 5000 conflict
    ports: []
    expose:
      - "5000"
    volumes:
      - staging_audio_data:/app/instance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ccall-staging.rule=Host(`${STAGING_DOMAIN:-staging-ccall.example.com}`)"
      - "traefik.http.services.ccall-staging.loadbalancer.server.port=5000"

  scheduler:
    build: .
    environment:
      <<: *staging-env
      ENABLE_SCHEDULER: "true"
      ENABLE_CALL_WORKER: "false"
      ENABLE_CALL_MONITOR: "false"
    volumes:
      - staging_audio_data:/app/instance

  call_worker:
    build: .
    environment:
      <<: *staging-env
      ENABLE_SCHEDULER: "false"
      ENABLE_CALL_WORKER: "true"
      ENABLE_CALL_MONITOR: "true"
    volumes:
      - staging_audio_data:/app/instance
    deploy:
      replicas: 1

  backup:
    environment:
      DATABASE_URL: ${STAGING_DATABASE_URL}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "14"
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    volumes:
      - staging_backup_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_audio_data:
  staging_backup_data:
