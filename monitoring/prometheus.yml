global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "ccall_web"
    static_configs:
      - targets: ["web:5000"]
    metrics_path: /metrics
    authorization:
      credentials: "staging-metrics-token-local-only"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
