---
# Staging-only Alertmanager config.
# All notifications route to local mock_webhook_receiver only.
# No real email, PagerDuty, Slack, or SMS endpoints.

global:
  resolve_timeout: 1m

templates: []

route:
  receiver: "mock_webhook"
  group_by: ["alertname"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 5m

inhibit_rules:
  - source_match:
      alertname: PostgreSQLDown
    target_match_re:
      alertname: ".+"
    equal: ["instance"]

  - source_match:
      alertname: CCallWebDown
    target_match:
      alertname: HTTP5xxRateHigh

receivers:
  - name: "mock_webhook"
    webhook_configs:
      - url: "http://mock_receiver:8080/webhook"
        send_resolved: true
        http_config: {}
